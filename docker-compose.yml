version: '3.8'

services:
  web:
    build: .
    container_name: hira_rentals_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: hira_rentals_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hira_property
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql